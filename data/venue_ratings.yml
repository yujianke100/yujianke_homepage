# 刊物 / 会议推荐指数（依据课题组《AI&DM&NLP&BioMed 刊物推荐表 2024.09》，作者 hua zhang，2024-09-23）
#
# 表内推荐顺序：A+++ > A++ > A+ > A > A- > B
#   表内原文口径：
#     (2) 优先考虑 A+ 及以上刊物（包括 CCF A 类顶会），原则上不考虑 A- 与 B
#     「其它 CCF A 类期刊」的推荐指数为 >= A+；「其它 CCF A 类会议(长文)」为 A+
#   因此判定规则（本文件按此填写）：
#     - 表内明确列出的 → 照抄
#     - 未列出但是 CCF-A 期刊 → >= A+（记为 "A+（其它 CCF A 类期刊）"）
#     - 未列出但是 CCF-A 会议且为长文 → A+（记为 "A+（其它 CCF A 类会议长文）"）
#     - CCF-B/C 且表内未列出 → 低于 A+，记为 "未收录"，不计入
#
# rating: null / 字符串。课题组推荐表口径（学术简历页用）。
#
# zjgsu_grade：浙工商学院《论文分级口径》的填写值（工商入职材料用，与《师资评议汇总表》
#   N 栏、《应聘申请表》论文表「论文等级」栏一致；2026-10-09 本人与导师商量后定稿）。
#   A+++ / A+ / A 三档计入分档统计；未填＝学院未分级，不入主表。
#   注意：该口径按「一作 / 通讯 / 导师一作·学生二作」署名角色计，一作非导师的合著不计入。

