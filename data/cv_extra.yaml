# CV-only data for the printable A4 CV (generated by scripts/build_cv.py).
#
# 为什么不写进 data/authors/me.yaml：HugoBlox 的 author schema 是 hugoblox/author/v1，
# 未定义的键可能在站点构建时校验失败。与站点渲染无关、只给打印版简历用的内容放这里。
#
# 中文版简历的内容在 data/cv_zh.yaml。
#
# 更新后重新生成：
#   python3 scripts/build_cv.py --pdf

# 简历头部联系方式（顺序即显示顺序；key 是左侧的灰色小标签）
contact:
  location: Hangzhou, China
  items:
    - key: Email
      label: yujianke100@gmail.com
      url: mailto:yujianke100@gmail.com
    - key: Web
      label: jianke-yu.online
      url: https://jianke-yu.online
    - key: Scholar
      label: Google Scholar
      url: https://scholar.google.com/citations?user=EwomMksAAAAJ
    - key: ORCID
      label: 0000-0002-2032-7727
      url: https://orcid.org/0000-0002-2032-7727
    - key: DBLP
      label: dblp.org/pid/316/0485
      url: https://dblp.org/pid/316/0485.html
    - key: GitHub
      label: github.com/yujianke100
      url: https://github.com/yujianke100

# 研究概述（简历里 Research Interests 之上的一段）
research_statement: |
  Machine learning for graph-structured data and database systems: graph neural network
  architectures for incomplete, heterogeneous and temporal graphs (fraud detection,
  malware detection, graph similarity computation), and learning-based methods that
  accelerate database and data-mining algorithms.

invited_talks:
  - title: "Scalable Big Data Computation"
    event: "Seminar, School of Data Science, The Chinese University of Hong Kong, Shenzhen"
    date: "18 Apr 2026"

academic_service:
  - role: "Peer Reviewer"
    org: "IEEE Transactions on Knowledge and Data Engineering (TKDE)"
    period: "2025"
  - role: "Platform Administrator"
    org: "Research Computing Platform, Prof. Ying Zhang & Prof. Xiaoyang Wang's Team, Zhejiang Gongshang University"
    period: "2024–"

teaching:
