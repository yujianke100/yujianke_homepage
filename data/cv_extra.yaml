# CV-only data for the printable A4 CV (generated by scripts/build_cv.py).
#
# 为什么不写进 data/authors/me.yaml：HugoBlox 的 author schema 是 hugoblox/author/v1，
# 未定义的键可能在站点构建时校验失败。与站点渲染无关、只给打印版简历用的内容放这里。
#
# 中文版简历的内容在 data/cv_zh.yaml。
#
# 更新后重新生成：
#   python3 scripts/build_cv.py --pdf

# 简历头部联系方式（顺序即显示顺序；key 是左侧的灰色小标签）
contact:
  location: Hangzhou, China
  items:
    - key: Email
      label: yujianke100@gmail.com
      url: mailto:yujianke100@gmail.com
    - key: Web
      label: jianke-yu.online
      url: https://jianke-yu.online
    - key: Scholar
      label: Google Scholar
      url: https://scholar.google.com/citations?user=EwomMksAAAAJ
    - key: ORCID
      label: 0000-0002-2032-7727
      url: https://orcid.org/0000-0002-2032-7727
    - key: DBLP
      label: dblp.org/pid/316/0485
      url: https://dblp.org/pid/316/0485.html
    - key: GitHub
      label: github.com/yujianke100
      url: https://github.com/yujianke100

# 研究概述（简历里 Research Interests 之上的一段）
research_statement: |
  Machine learning for graph-structured data and database systems: graph neural network
  architectures for incomplete, heterogeneous and temporal graphs (fraud detection,
  malware detection, graph similarity computation), and learning-based methods that
  accelerate database and data-mining algorithms.

invited_talks:
  - title: "Scalable Big Data Computation"
    event: "Seminar, School of Data Science, The Chinese University of Hong Kong, Shenzhen"
    date: "18 Apr 2026"

academic_service:
  - role: "Peer Reviewer"
    org: "IEEE Transactions on Knowledge and Data Engineering (TKDE)"
    period: "2025"
  - role: "Platform Administrator"
    org: "Research Computing Platform, Prof. Ying Zhang & Prof. Xiaoyang Wang's Team, Zhejiang Gongshang University"
    period: "2024–"
    note: "Maintaining the group's GPU research computing platform (training and inference environments, accounts, resource scheduling)."

# 荣誉与奖励 / 奖学金与资助 的拆分：这里列出属于"奖学金与资助"的奖项标题
# （标题必须与 data/authors/me.yaml: awards 里的 title 完全一致，其余归入 Honors & Awards）
awards_split:
  scholarships:
    - "National Award for Outstanding Self-Financed Students Abroad (2025–2026)"
    - "UTS ARC Discovery Project Scholarship (Full Scholarship)"
    - "UTS International Research Scholarship"

# 段落开关（简历上要不要显示某一段）
sections:
  skills: false        # 技能段（用户认为相比之下不太重要，先关闭）

teaching:
  - role: "Guest Lecturer"
    org: "43023 Emerging Topics in Artificial Intelligence, University of Technology Sydney"
    period: "Spring 2025"
  - role: "Teaching Assistant"
    org: "COMP9311 Database Systems, UNSW Sydney"
    period: "Term 3 2023"
  - role: "Teaching Assistant"
    org: "DATA1001 Introduction to Data Science, UNSW Sydney"
    period: "Term 2 2024, Term 2 2025"

# 论文列表的筛选与排序
publications:
  # mode:
  #   first_author_ccf_a = 只列第一作者的 CCF-A 论文（现用；数量统计行仍统计全部论文）
  #   first_author       = 只列第一作者论文
  #   all                = 全部同行评审论文
  mode: first_author_ccf_a
  max_items: 20                # 上限（mode 已筛选，一般用不到）
  page_break_before: false     # false / 段落 key（publications、scholarships、honors、activities）/ true=publications
                               # 用来强制某段从第 2 页开始；内容只剩约 1.5 页时，强制分页会让第 1 页空掉三分之一
  include_preprints: false     # 预印本（arXiv）是否进简历
  featured_first: true         # 先列 selected/featured 的论文
