research_statement: |
  面向图结构数据与数据库系统的机器学习方法研究：面向不完整图、属性图与动态图的图神经网络
  结构（欺诈检测、恶意软件检测、图相似性计算），以及用于加速数据库查询与数据挖掘过程的
  学习型算法。

interests: 图神经网络、图数据库、面向数据库的 AI、欺诈检测、知识图谱

