role: PhD (2026) in Graph Machine Learning & Databases
bio: |
  I completed my PhD at the University of Technology Sydney (UTS) in 2026, supervised by
  Prof. Ying Zhang, A/Prof. Lu Qin and Dr Hanchen Wang. My research develops machine learning algorithms
  for graph-structured data and database systems — graph neural network architectures,
  and learning-based methods that improve database and data-mining algorithms
  (fraud detection, graph similarity, supergraph search, malware detection).
  My work has appeared in KDD and IEEE TKDE. I am joining Zhejiang Gongshang
  University as a faculty member in 2027.

