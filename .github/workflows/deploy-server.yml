name: Build & deploy to server (jianke-yu.online)

# 拓扑：GitHub Actions 负责构建（服务器 CPU 弱，不参与构建），只把构建好的
# 静态文件打包上传到 upload.jianke-yu.online，由服务器上的脚本解包。
#
#   push / 手动选 preview → homepage_preview.tar.gz → ~/deploy_preview.sh
#                           → /home/homepage/homepage_preview → https://jianke-yu.online/preview/
#   手动选 live           → homepage.tar.gz → ~/deploy_homepage.sh（沿用旧站原脚本）
#                           → /home/homepage/homepage → https://jianke-yu.online/
#
# 诊断：日志会发布到 ci-logs 分支（匿名可读），构建失败时也会把 hugo 日志回传服务器
#       /home/homepage/build-error.log。

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      target:
        description: "部署目标"
        required: true
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: write

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: upload.jianke-yu.online
      DEPLOY_PORT: "10198"
      DEPLOY_USER: homepage
      DEPLOY_DIR: /home/homepage
      HUGO_VERSION: "0.162.1"
      NODE_VERSION: "22"
      TARGET: ${{ inputs.target || 'preview' }}
    steps:
      - name: Heartbeat (诊断：确认工作流启动 + secret + SSH 可用)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set +e
          {
            echo "run=${{ github.run_id }} event=${{ github.event_name }} sha=${{ github.sha }}"
            echo "secret_present=$([ -n "$SSH_PRIVATE_KEY" ] && echo yes || echo NO)"
            echo "time=$(date -u '+%F %T UTC')"
          } > /tmp/hb.log
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -p "$DEPLOY_PORT" -t rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "--- ssh test ---" >> /tmp/hb.log
            ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" 'echo SSH_OK; whoami; pwd; ls -la ~/deploy_preview.sh' >> /tmp/hb.log 2>&1
            echo "ssh_exit=$?" >> /tmp/hb.log
            scp -o StrictHostKeyChecking=accept-new -P "$DEPLOY_PORT" /tmp/hb.log "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/ci-heartbeat.log" >> /tmp/hb.log 2>&1
            echo "scp_exit=$?" >> /tmp/hb.log
          fi
          cat /tmp/hb.log

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Hugo 的 .GitInfo/.Lastmod 需要完整历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4

      - name: Install JS deps (Tailwind / Pagefind)
        if: hashFiles('package.json') != ''
        run: pnpm install --no-frozen-lockfile

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        timeout-minutes: 12
        run: |
          set -o pipefail
          if [ "$TARGET" = "live" ]; then
            BASE_URL="https://jianke-yu.online/"
          else
            BASE_URL="https://jianke-yu.online/preview/"
          fi
          echo "TARGET=$TARGET  BASE_URL=$BASE_URL  hugo=$(hugo version)"
          timeout 600 hugo --minify --baseURL "$BASE_URL" --logLevel info 2>&1 | tee /tmp/build.log
          rc=$?
          echo "hugo_exit=$rc" | tee -a /tmp/build.log
          if [ "$rc" != "0" ]; then
            echo "--- hugo 失败，最后 60 行 ---" | tee -a /tmp/build.log
            tail -60 /tmp/build.log | tee -a /tmp/diagnostic-tail.log
            exit "$rc"
          fi
          echo "--- 产物统计 ---" | tee -a /tmp/build.log
          du -sh public | tee -a /tmp/build.log
          find public -type f | wc -l | tee -a /tmp/build.log

      - name: Pack static files
        run: |
          if [ "$TARGET" = "live" ]; then
            tar -czf homepage.tar.gz -C public .
          else
            tar -czf homepage_preview.tar.gz -C public .
          fi
          ls -lh homepage_*.tar.gz

      - name: Upload to server and activate
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::缺少 secret SSH_PRIVATE_KEY（需要与旧仓库相同的部署私钥）"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$DEPLOY_PORT" -t rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ "$TARGET" = "live" ]; then
            scp -o StrictHostKeyChecking=accept-new -P "$DEPLOY_PORT" homepage.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/" 2>&1 | tee /tmp/deploy.log
            ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "~/deploy_homepage.sh" 2>&1 | tee -a /tmp/deploy.log
          else
            scp -o StrictHostKeyChecking=accept-new -P "$DEPLOY_PORT" homepage_preview.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/" 2>&1 | tee /tmp/deploy.log
            ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "~/deploy_preview.sh" 2>&1 | tee -a /tmp/deploy.log
          fi
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "curl -s -o /dev/null -w 'preview_http=%{http_code}\n' https://jianke-yu.online/preview/ || true" 2>&1 | tee -a /tmp/deploy.log

      - name: Publish diagnostics to ci-logs branch (匿名可读，便于排查)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf /tmp/publog && mkdir -p /tmp/publog && cd /tmp/publog
          git init -q -b ci-logs
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          {
            echo "run_id=${{ github.run_id }}"
            echo "event=${{ github.event_name }}"
            echo "sha=${{ github.sha }}"
            echo "target=$TARGET"
            echo "job_status=${{ job.status }}"
            echo "time=$(date -u '+%F %T UTC')"
            echo "TARGET=$TARGET"
          } > status.txt
          for f in /tmp/build.log /tmp/hb.log /tmp/deploy.log /tmp/diagnostic-tail.log; do
            [ -f "$f" ] && cp "$f" "."
          done
          ls -la
          git add -A
          if git commit -q -m "diagnostics for run ${{ github.run_id }} (${{ job.status }})"; then
            git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs \
              && echo "诊断日志已发布到 ci-logs 分支" || echo "诊断日志推送失败"
          fi
