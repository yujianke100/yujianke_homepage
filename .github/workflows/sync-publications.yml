name: Sync publications (OpenAlex)

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Sync publications from OpenAlex
        run: python scripts/sync_publications.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publications
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "chore: sync publications from OpenAlex"
            git push
          fi
