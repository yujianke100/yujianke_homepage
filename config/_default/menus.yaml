# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order of the links will appear in.
#   顺序：Publications 之后紧跟 Full List（完整论文列表）

main:
  - name: About
    url: /
    weight: 10
  - name: News
    url: /#news
    weight: 20
  - name: Publications
    url: /#publications
    weight: 30
  - name: Full List
    url: /publications/
    weight: 35
  - name: Academic Services
    url: /#services
    weight: 40
  - name: CV
    url: experience/
    weight: 50
